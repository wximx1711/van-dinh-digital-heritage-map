# Preserve the original client scheme when served behind Cloudflare:
# Cloudflare terminates TLS and forwards X-Forwarded-Proto: https; fall back
# to the connection scheme ($scheme) when no proxy header is present (dev).
map $http_x_forwarded_proto $vd_x_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded media is served by the backend (kept out of nginx for consistency).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vd_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        client_max_body_size 110m; # must be >= the largest allowed upload (videos: 100 MB)
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vd_x_forwarded_proto;
        expires 30d;
    }

    # SPA shell — the app performs its own routing (including /evaluate for QR kiosk links).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
